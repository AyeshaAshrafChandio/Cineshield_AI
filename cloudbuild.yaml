# Google Cloud Build configuration for CineShield AI
# Automatically builds, tests, packages, and deploys to Google Cloud Run

substitutions:
  _REGION: 'us-central1'
  _SERVICE_NAME: 'cineshield-ai'
  _ARTIFACT_REPO: 'cloud-run-source-deploy'

steps:
  # Step 1: Run automated tests in clean container
  - name: 'node:20'
    id: 'test'
    entrypoint: 'npm'
    args: ['test']

  # Step 2: Build container image with BuildKit
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '--tag'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--tag'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
      - '.'

  # Step 3: Push image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}'

  # Step 4: Deploy to Google Cloud Run with production configuration
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300s'
      - '--set-secrets'
      - 'DATABASE_URL=cineshield-database-url:latest,GEMINI_API_KEY=cineshield-gemini-api-key:latest'
      - '--set-env-vars'
      - 'NODE_ENV=production'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
